<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI わくわくパズルゲーム</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Kid-friendly rounded font */
        body {
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #fff0f5; /* pastel pink background */
            background-image: radial-gradient(#ffd1dc 2px, transparent 2px);
            background-size: 30px 30px;
        }

        /* Fun Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(0); }
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants & Config
        const API_KEY = ""; // Injected automatically by the environment
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${API_KEY}`;
        
        const THEMES = {
            'animal': { label: 'どうぶつ', basePrompt: 'A cute, colorful, high quality illustration of friendly baby animals for kids' },
            'nature': { label: '自然の景色', basePrompt: 'A beautiful, vibrant, cartoon nature scenery landscape, colorful, kid friendly illustration' },
            'princess': { label: 'プリキュアのようなプリンセス', basePrompt: 'An anime style magical girl princess, cute, colorful, high quality anime art style, sparkling' }
        };

        const DIFFICULTIES = [
            { label: '16ピース (4x4)', value: 4 },
            { label: '25ピース (5x5)', value: 5 },
            { label: '36ピース (6x6)', value: 6 }
        ];

        // Random adjectives to ensure unique image generation every time
        const RANDOM_ADJECTIVES = [
            "sparkling", "pastel colored", "vibrant", "dreamy", "neon highlights",
            "watercolor style", "storybook style", "sunny lighting", "magical atmosphere",
            "fluffy", "rainbow accents", "candy-like colors", "starlight"
        ];

        function App() {
            const [gameState, setGameState] = useState('menu'); // menu, loading, playing, won, error
            const [theme, setTheme] = useState('animal');
            const [gridSize, setGridSize] = useState(4);
            const [pieces, setPieces] = useState([]);
            const [fullImageUrl, setFullImageUrl] = useState('');
            const [selectedPieceIdx, setSelectedPieceIdx] = useState(null);
            const [errorMessage, setErrorMessage] = useState('');

            // --- API Call to Generate Image ---
            const generateImage = async () => {
                setGameState('loading');
                setErrorMessage('');
                
                try {
                    // Pick 2 random adjectives to force uniqueness
                    const shuffledAdjs = [...RANDOM_ADJECTIVES].sort(() => 0.5 - Math.random());
                    const uniqueModifiers = `${shuffledAdjs[0]}, ${shuffledAdjs[1]}`;
                    // Add a random seed string to further guarantee a completely new image
                    const randomSeed = Math.random().toString(36).substring(2, 10);
                    
                    const prompt = `${THEMES[theme].basePrompt}. Elements: ${uniqueModifiers}. (Seed: ${randomSeed})`;

                    const payload = {
                        contents: [{
                            role: 'user',
                            parts: [{ text: prompt }]
                        }],
                        generationConfig: {
                            responseModalities: ['IMAGE'],
                            imageConfig: { aspectRatio: "1:1" } // Square aspect ratio for square puzzle grids
                        }
                    };

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error("APIリクエストに失敗しました (API request failed)");

                    const data = await response.json();
                    const base64Data = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    
                    if (!base64Data) throw new Error("画像の生成に失敗しました (Image generation failed)");
                    
                    const imageUrl = `data:image/jpeg;base64,${base64Data}`;
                    setFullImageUrl(imageUrl);
                    
                    // Slice the generated image into pieces
                    await preparePuzzlePieces(imageUrl, gridSize);
                    
                } catch (error) {
                    console.error("Error generating image:", error);
                    setErrorMessage("ごめんね、エラーがおきたみたい。もういちどためしてね！\n" + error.message);
                    setGameState('error');
                }
            };

            // --- Slicing Image with Canvas ---
            const preparePuzzlePieces = (src, size) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        const pieceWidth = img.width / size;
                        const pieceHeight = img.height / size;
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = pieceWidth;
                        canvas.height = pieceHeight;

                        let newPieces = [];
                        
                        for (let y = 0; y < size; y++) {
                            for (let x = 0; x < size; x++) {
                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                ctx.drawImage(
                                    img,
                                    x * pieceWidth, y * pieceHeight, pieceWidth, pieceHeight,
                                    0, 0, canvas.width, canvas.height
                                );
                                newPieces.push({
                                    id: y * size + x, // The correct target index
                                    dataUrl: canvas.toDataURL('image/jpeg', 0.9)
                                });
                            }
                        }

                        // Shuffle pieces
                        let shuffled = [...newPieces];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }

                        // Ensure it's not solved right away
                        let isSolved = shuffled.every((p, i) => p.id === i);
                        if (isSolved && shuffled.length > 1) {
                            [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
                        }

                        setPieces(shuffled);
                        setGameState('playing');
                        resolve();
                    };
                    img.onerror = () => reject(new Error("Image load failed for slicing."));
                    img.src = src;
                });
            };

            // --- Game Logic ---
            const handlePieceClick = (index) => {
                if (gameState !== 'playing') return;

                if (selectedPieceIdx === null) {
                    // Select first piece
                    setSelectedPieceIdx(index);
                } else if (selectedPieceIdx === index) {
                    // Deselect if clicked same piece
                    setSelectedPieceIdx(null);
                } else {
                    // Swap pieces
                    const newPieces = [...pieces];
                    const temp = newPieces[selectedPieceIdx];
                    newPieces[selectedPieceIdx] = newPieces[index];
                    newPieces[index] = temp;
                    
                    setPieces(newPieces);
                    setSelectedPieceIdx(null);
                    
                    // Check win condition
                    checkWin(newPieces);
                }
            };

            const checkWin = (currentPieces) => {
                const isWin = currentPieces.every((piece, index) => piece.id === index);
                if (isWin) {
                    setTimeout(() => setGameState('won'), 300);
                }
            };

            // --- Render Helpers ---
            const renderMenu = () => (
                <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center animate-pop border-4 border-pink-200">
                    <h1 className="text-3xl font-extrabold text-pink-500 mb-6 drop-shadow-sm">
                        ✨ AI パズル ✨
                    </h1>
                    
                    <div className="mb-6 text-left">
                        <label className="block text-lg font-bold text-gray-700 mb-2">どんな絵にする？</label>
                        <select 
                            value={theme}
                            onChange={(e) => setTheme(e.target.value)}
                            className="w-full text-lg p-3 rounded-xl border-2 border-purple-200 bg-purple-50 text-purple-800 focus:outline-none focus:ring-4 focus:ring-purple-300 transition-all cursor-pointer"
                        >
                            {Object.entries(THEMES).map(([key, t]) => (
                                <option key={key} value={key}>{t.label}</option>
                            ))}
                        </select>
                    </div>

                    <div className="mb-8 text-left">
                        <label className="block text-lg font-bold text-gray-700 mb-2">むずかしさ</label>
                        <select 
                            value={gridSize}
                            onChange={(e) => setGridSize(Number(e.target.value))}
                            className="w-full text-lg p-3 rounded-xl border-2 border-blue-200 bg-blue-50 text-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all cursor-pointer"
                        >
                            {DIFFICULTIES.map(d => (
                                <option key={d.value} value={d.value}>{d.label}</option>
                            ))}
                        </select>
                    </div>

                    <button 
                        onClick={generateImage}
                        className="w-full py-4 bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white text-xl font-bold rounded-2xl shadow-lg transform hover:scale-105 transition-all duration-200"
                    >
                        新しいパズルを作る！🚀
                    </button>
                </div>
            );

            const renderLoading = () => (
                <div className="flex flex-col items-center justify-center animate-pop">
                    <div className="w-24 h-24 border-8 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-6 shadow-lg"></div>
                    <h2 className="text-2xl font-bold text-pink-600 animate-pulse bg-white px-6 py-2 rounded-full shadow-sm">
                        AIがえをかいているよ... 🎨✨
                    </h2>
                </div>
            );

            const renderPlaying = () => (
                <div className="flex flex-col items-center w-full max-w-2xl animate-pop">
                    <div className="bg-white p-4 rounded-3xl shadow-xl w-full">
                        <div className="flex justify-between items-center mb-4 px-2">
                            <span className="text-lg font-bold text-gray-600">ピースをいれかえてね！</span>
                            <button 
                                onClick={() => setGameState('menu')}
                                className="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold transition-colors shadow-sm"
                            >
                                やめる
                            </button>
                        </div>
                        
                        {/* Puzzle Grid */}
                        <div 
                            className="grid gap-1 bg-gray-100 p-2 rounded-2xl mx-auto touch-none"
                            style={{ 
                                gridTemplateColumns: `repeat(${gridSize}, minmax(0, 1fr))`,
                                width: '100%',
                                maxWidth: '600px',
                                aspectRatio: '1/1'
                            }}
                        >
                            {pieces.map((piece, index) => {
                                const isSelected = selectedPieceIdx === index;
                                return (
                                    <div 
                                        key={index}
                                        onClick={() => handlePieceClick(index)}
                                        className={`
                                            relative cursor-pointer w-full h-full rounded-md overflow-hidden
                                            transition-all duration-200 ease-in-out
                                            ${isSelected ? 'ring-4 ring-yellow-400 scale-95 z-10 shadow-lg' : 'hover:scale-[1.02] shadow-sm'}
                                        `}
                                    >
                                        <img 
                                            src={piece.dataUrl} 
                                            alt={`piece-${index}`}
                                            className="w-full h-full object-cover pointer-events-none"
                                        />
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );

            const renderWon = () => (
                <div className="flex flex-col items-center animate-pop max-w-lg w-full">
                    <div className="bg-white p-6 rounded-3xl shadow-2xl text-center border-4 border-yellow-300 relative overflow-hidden">
                        
                        {/* Confetti / Sparkles effect using CSS */}
                        <div className="absolute inset-0 pointer-events-none flex justify-around">
                            <div className="text-4xl animate-bounce" style={{animationDelay: '0.1s'}}>✨</div>
                            <div className="text-4xl animate-bounce" style={{animationDelay: '0.3s'}}>🎉</div>
                            <div className="text-4xl animate-bounce" style={{animationDelay: '0.5s'}}>🌟</div>
                        </div>

                        <h2 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-pink-500 mb-6 drop-shadow-sm mt-4">
                            クリア！<br/>おめでとう！
                        </h2>
                        
                        <div className="p-2 bg-gradient-to-tr from-pink-200 to-yellow-200 rounded-2xl mb-6 shadow-inner">
                            <img 
                                src={fullImageUrl} 
                                alt="Completed" 
                                className="w-full h-auto rounded-xl shadow-md animate-bounce-slow"
                            />
                        </div>
                        
                        <button 
                            onClick={() => setGameState('menu')}
                            className="w-full py-4 bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white text-2xl font-bold rounded-2xl shadow-lg transform hover:scale-105 transition-all duration-200"
                        >
                            もう一度遊ぶ！ 🎮
                        </button>
                    </div>
                </div>
            );

            const renderError = () => (
                <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center animate-pop border-4 border-red-200">
                    <div className="text-6xl mb-4">😢</div>
                    <h2 className="text-2xl font-bold text-red-500 mb-4">エラーがおきました</h2>
                    <p className="text-gray-600 mb-6 whitespace-pre-wrap">{errorMessage}</p>
                    <button 
                        onClick={() => setGameState('menu')}
                        className="px-6 py-3 bg-pink-400 hover:bg-pink-500 text-white text-lg font-bold rounded-xl shadow-md transition-colors"
                    >
                        メニューにもどる
                    </button>
                </div>
            );

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {gameState === 'menu' && renderMenu()}
                    {gameState === 'loading' && renderLoading()}
                    {gameState === 'playing' && renderPlaying()}
                    {gameState === 'won' && renderWon()}
                    {gameState === 'error' && renderError()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
