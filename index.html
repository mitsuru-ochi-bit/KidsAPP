<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>わくわく タイルパズル</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Kid-friendly rounded font & pastel background */
        body {
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
            background-color: #fff0f5;
            background-image: radial-gradient(#ffd1dc 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Fun Animations */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Predefined image data
        const PREMADE = { 
            animal: Array.from({length: 10}).map((_, i) => 'https://image.pollinations.ai/prompt/cute%20animal%20friends,%20kids%20book?width=600&height=600&nologo=true&seed=' + (100 + i)), 
            nature: Array.from({length: 10}).map((_, i) => 'https://image.pollinations.ai/prompt/beautiful%20nature%20scenery,%20kids%20book?width=600&height=600&nologo=true&seed=' + (200 + i)), 
            princess: Array.from({length: 10}).map((_, i) => 'https://image.pollinations.ai/prompt/cute%20anime%20magical%20girl%20princess,%20precure%20style?width=600&height=600&nologo=true&seed=' + (300 + i)) 
        };

        const DIFFICULTIES = [
            { label: '16 ピース', sub: '(4x4)', value: 4, color: 'bg-green-100 hover:bg-green-200 border-green-300 text-green-700' },
            { label: '25 ピース', sub: '(5x5)', value: 5, color: 'bg-blue-100 hover:bg-blue-200 border-blue-300 text-blue-700' },
            { label: '36 ピース', sub: '(6x6)', value: 6, color: 'bg-purple-100 hover:bg-purple-200 border-purple-300 text-purple-700' }
        ];

        const CATEGORIES = [
            { id: 'animal', label: '🐶 どうぶつ', style: 'bg-orange-400 hover:bg-orange-500 shadow-orange-600' },
            { id: 'nature', label: '🌳 しぜん', style: 'bg-green-400 hover:bg-green-500 shadow-green-600' },
            { id: 'princess', label: '👑 プリンセス', style: 'bg-pink-400 hover:bg-pink-500 shadow-pink-600' },
            { id: 'random', label: '🎲 おまかせ', style: 'bg-purple-400 hover:bg-purple-500 shadow-purple-600' }
        ];

        function App() {
            const [gameState, setGameState] = useState('menu'); // menu, loading, playing, won
            const [gridSize, setGridSize] = useState(4);
            const [pieces, setPieces] = useState([]);
            const [fullImageUrl, setFullImageUrl] = useState('');
            const [lastPlayedUrl, setLastPlayedUrl] = useState('');
            const [selectedPieceIdx, setSelectedPieceIdx] = useState(null);

            // Start game with selected category
            const startGame = (categoryId) => {
                let selectedCat = categoryId;
                
                // Handle 'random' category
                if (categoryId === 'random') {
                    const keys = ['animal', 'nature', 'princess'];
                    selectedCat = keys[Math.floor(Math.random() * keys.length)];
                }

                const urls = PREMADE[selectedCat];
                let newUrl = urls[Math.floor(Math.random() * urls.length)];

                // Ensure the new random image is never the same as the immediately previous one
                if (urls.length > 1) {
                    while (newUrl === lastPlayedUrl) {
                        newUrl = urls[Math.floor(Math.random() * urls.length)];
                    }
                }

                setLastPlayedUrl(newUrl);
                setFullImageUrl(newUrl);
                setGameState('loading');
                setSelectedPieceIdx(null);

                // Preload image to avoid blank pieces during load
                const img = new Image();
                img.onload = () => {
                    initializePuzzle(newUrl, gridSize);
                    setGameState('playing');
                };
                img.onerror = () => {
                    console.error("画像の読み込みに失敗しました");
                    setGameState('menu');
                };
                img.src = newUrl;
            };

            const initializePuzzle = (url, size) => {
                const totalPieces = size * size;
                let initialPieces = Array.from({ length: totalPieces }, (_, i) => i);

                // Shuffle pieces (Fisher-Yates algorithm)
                for (let i = totalPieces - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [initialPieces[i], initialPieces[j]] = [initialPieces[j], initialPieces[i]];
                }

                // Prevent the puzzle from being already solved upon starting
                if (initialPieces.every((p, i) => p === i) && totalPieces > 1) {
                    [initialPieces[0], initialPieces[1]] = [initialPieces[1], initialPieces[0]];
                }

                setPieces(initialPieces);
            };

            const handlePieceClick = (index) => {
                if (gameState !== 'playing') return;

                if (selectedPieceIdx === null) {
                    // Select first piece
                    setSelectedPieceIdx(index);
                } else if (selectedPieceIdx === index) {
                    // Deselect if clicked again
                    setSelectedPieceIdx(null);
                } else {
                    // Swap the two pieces
                    const newPieces = [...pieces];
                    const temp = newPieces[selectedPieceIdx];
                    newPieces[selectedPieceIdx] = newPieces[index];
                    newPieces[index] = temp;
                    
                    setPieces(newPieces);
                    setSelectedPieceIdx(null);
                    
                    // Check if puzzle is solved
                    if (newPieces.every((p, i) => p === i)) {
                        setTimeout(() => setGameState('won'), 300);
                    }
                }
            };

            // --- Render Components ---

            const renderMenu = () => (
                <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md text-center animate-pop border-4 border-pink-200">
                    <h1 className="text-3xl sm:text-4xl font-extrabold text-pink-500 mb-8 drop-shadow-sm animate-float">
                        ✨ わくわく パズル ✨
                    </h1>
                    
                    <div className="mb-8">
                        <label className="block text-xl font-bold text-gray-700 mb-4">
                            むずかしさをえらんでね！
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                            {DIFFICULTIES.map(d => (
                                <button
                                    key={d.value}
                                    onClick={() => setGridSize(d.value)}
                                    className={`p-3 rounded-2xl border-b-4 font-bold flex flex-col items-center justify-center transition-all transform hover:-translate-y-1 ${d.color} ${gridSize === d.value ? 'ring-4 ring-pink-400 border-b-0 translate-y-1' : ''}`}
                                >
                                    <span className="text-lg">{d.label}</span>
                                    <span className="text-sm opacity-80">{d.sub}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <label className="block text-xl font-bold text-gray-700 mb-4">
                            あそぶテーマをえらんでね！
                        </label>
                        <div className="grid grid-cols-2 gap-4">
                            {CATEGORIES.map(cat => (
                                <button 
                                    key={cat.id}
                                    onClick={() => startGame(cat.id)}
                                    className={`py-4 rounded-2xl text-white text-xl font-bold border-b-4 transition-all transform hover:-translate-y-1 active:translate-y-1 active:border-b-0 ${cat.style}`}
                                >
                                    {cat.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderLoading = () => (
                <div className="flex flex-col items-center justify-center animate-pop">
                    <div className="w-24 h-24 border-8 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-6 shadow-lg"></div>
                    <h2 className="text-2xl font-bold text-pink-600 animate-pulse bg-white px-8 py-3 rounded-full shadow-sm border-2 border-pink-200">
                        じゅんびちゅう... 🎨
                    </h2>
                </div>
            );

            const renderPlaying = () => (
                <div className="flex flex-col items-center w-full max-w-2xl animate-pop px-2">
                    <div className="w-full flex justify-between items-center mb-4 bg-white px-6 py-3 rounded-full shadow-md border-2 border-pink-100">
                        <span className="text-xl font-bold text-gray-700">
                            ピースをいれかえよう！
                        </span>
                        <button 
                            onClick={() => setGameState('menu')}
                            className="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl font-bold transition-colors shadow-sm"
                        >
                            やめる
                        </button>
                    </div>
                    
                    {/* Puzzle Grid */}
                    <div 
                        className="bg-gray-300 p-1 sm:p-2 rounded-xl sm:rounded-2xl mx-auto shadow-inner w-full aspect-square touch-none grid gap-1"
                        style={{ 
                            gridTemplateColumns: `repeat(${gridSize}, minmax(0, 1fr))`,
                            gridTemplateRows: `repeat(${gridSize}, minmax(0, 1fr))`
                        }}
                    >
                        {pieces.map((pieceId, index) => {
                            // Calculate proper background position based on the piece's original ID
                            const origRow = Math.floor(pieceId / gridSize);
                            const origCol = pieceId % gridSize;
                            const bgX = `${origCol * (100 / (gridSize - 1))}%`;
                            const bgY = `${origRow * (100 / (gridSize - 1))}%`;
                            
                            const isSelected = selectedPieceIdx === index;

                            return (
                                <div 
                                    key={index}
                                    onClick={() => handlePieceClick(index)}
                                    className={`
                                        w-full h-full bg-no-repeat rounded-md cursor-pointer 
                                        transition-all duration-200 ease-in-out bg-white
                                        ${isSelected ? 'ring-4 ring-yellow-400 scale-95 z-10 shadow-lg brightness-110' : 'hover:scale-[0.98] shadow-sm'}
                                    `}
                                    style={{
                                        backgroundImage: `url(${fullImageUrl})`,
                                        backgroundSize: `${gridSize * 100}% ${gridSize * 100}%`,
                                        backgroundPosition: `${bgX} ${bgY}`
                                    }}
                                />
                            );
                        })}
                    </div>
                </div>
            );

            const renderWon = () => (
                <div className="flex flex-col items-center animate-pop max-w-lg w-full px-4">
                    <div className="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl text-center border-4 border-yellow-300 relative overflow-hidden w-full">
                        
                        {/* Confetti / Sparkles effect */}
                        <div className="absolute inset-0 pointer-events-none flex justify-around">
                            <div className="text-4xl animate-float" style={{animationDelay: '0.1s'}}>✨</div>
                            <div className="text-4xl animate-float" style={{animationDelay: '0.5s'}}>🎉</div>
                            <div className="text-4xl animate-float" style={{animationDelay: '0.3s'}}>🌟</div>
                        </div>

                        <h2 className="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-pink-500 mb-6 drop-shadow-sm mt-2">
                            クリア！おめでとう！
                        </h2>
                        
                        <div className="p-2 sm:p-4 bg-gradient-to-tr from-pink-100 to-yellow-100 rounded-2xl mb-8 shadow-inner">
                            <img 
                                src={fullImageUrl} 
                                alt="Completed" 
                                className="w-full h-auto rounded-xl shadow-md"
                            />
                        </div>
                        
                        <button 
                            onClick={() => setGameState('menu')}
                            className="w-full py-4 bg-gradient-to-b from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white text-2xl font-bold rounded-2xl shadow-[0_4px_0_rgb(21,128,61)] transform hover:translate-y-1 hover:shadow-none transition-all duration-150"
                        >
                            もういちどあそぶ！ 🎮
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    {gameState === 'menu' && renderMenu()}
                    {gameState === 'loading' && renderLoading()}
                    {gameState === 'playing' && renderPlaying()}
                    {gameState === 'won' && renderWon()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
