<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>まほうのかん字ガーデン - なぞってそだてる小学1年生のかん字</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>

  <style>
    * {
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background: linear-gradient(135deg, #fff5f8 0%, #f0f7ff 50%, #f6f0ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .chalk-grid {
      background-size: 50% 50%;
      background-image: 
        linear-gradient(to right, rgba(244, 114, 182, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(244, 114, 182, 0.2) 1px, transparent 1px);
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes pulse-gentle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes sparkle-anim {
      0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
      100% { opacity: 0; transform: scale(0.2) rotate(360deg); }
    }
    @keyframes shake-gentle {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake {
      animation: shake-gentle 0.45s ease-in-out;
    }
    .animate-float {
      animation: floaty 3.5s ease-in-out infinite;
    }
    .animate-pulse-gentle {
      animation: pulse-gentle 2s ease-in-out infinite;
    }
    .bouncy-btn {
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bouncy-btn:active {
      transform: scale(0.92);
    }
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: #f472b6;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-track {
      background: #fce7f3;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen text-slate-700 selection:bg-pink-200">

  <!-- ヘッダー：タイトルとお庭のレベル、しずくメーター -->
  <header class="bg-white/90 backdrop-blur-md border-b-4 border-pink-200 sticky top-0 z-40 px-3 py-2 shadow-sm">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-3xl animate-bounce">🌸</span>
        <div>
          <h1 class="text-lg md:text-xl font-extrabold text-pink-600 tracking-wider flex items-center gap-1">
            まほうのかん字ガーデン
          </h1>
          <p class="text-xs text-pink-400 font-bold hidden sm:block">なぞってまほうをかけよう！</p>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-4">
        <!-- まほうのしずくポイント -->
        <div class="flex items-center bg-pink-50 border-2 border-pink-300 rounded-full px-3 py-1 shadow-inner">
          <span class="text-xl mr-1 animate-pulse">💧</span>
          <span id="dropsCount" class="font-extrabold text-pink-600 text-base md:text-lg">0</span>
          <span class="text-xs text-pink-400 font-bold ml-1">しずく</span>
        </div>

        <!-- ガーデンレベル -->
        <div class="flex items-center bg-emerald-50 border-2 border-emerald-300 rounded-full px-3 py-1 shadow-inner">
          <span class="text-xl mr-1">🌱</span>
          <span class="text-xs font-bold text-emerald-700 mr-1">Lv.</span>
          <span id="gardenLevelText" class="font-black text-emerald-600 text-base md:text-lg">1</span>
        </div>

        <!-- 音声ミュート切り替え -->
        <button id="soundToggleBtn" class="bouncy-btn bg-purple-100 hover:bg-purple-200 text-purple-600 p-2 rounded-full border-2 border-purple-300 shadow-sm text-lg" title="おとのきりかえ">
          🔊
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-4xl w-full mx-auto p-3 md:p-4 flex flex-col gap-4">
    
    <!-- まほうのガーデン（育成エリア） -->
    <section class="bg-gradient-to-b from-sky-100 via-emerald-50 to-emerald-100 rounded-3xl p-4 border-4 border-white shadow-xl relative overflow-hidden">
      <div class="absolute -top-4 left-6 text-4xl opacity-70 animate-float">☁️</div>
      <div class="absolute top-2 right-12 text-3xl opacity-60 animate-float" style="animation-delay: 1.5s;">☁️</div>
      <div class="absolute top-3 left-1/3 text-xl opacity-80 animate-pulse">✨</div>
      <div class="absolute top-8 right-1/4 text-xl opacity-80 animate-pulse" style="animation-delay: 1s;">🌟</div>

      <div class="flex justify-between items-center relative z-10 mb-2">
        <div class="flex items-center gap-2">
          <span class="bg-white/80 backdrop-blur px-3 py-1 rounded-full text-xs md:text-sm font-extrabold text-emerald-700 shadow-sm border border-emerald-200">
            🌷 わたしのおにわ
          </span>
          <span id="gardenStatusText" class="text-xs font-bold text-emerald-600">お花がすくすく育っているよ！</span>
        </div>
        <button id="viewCollectionBtn" class="bouncy-btn text-xs md:text-sm bg-amber-400 hover:bg-amber-300 text-amber-900 font-extrabold px-3 py-1.5 rounded-full border-2 border-amber-200 shadow-md flex items-center gap-1">
          <span>📖</span><span>シールちょう (<span id="unlockedCount">0</span>/80)</span>
        </button>
      </div>

      <div id="gardenStage" class="relative w-full h-36 md:h-44 bg-white/40 rounded-2xl border-2 border-emerald-200/60 p-3 flex items-end justify-around overflow-hidden shadow-inner">
        <div class="absolute bottom-0 inset-x-0 h-8 bg-emerald-300/40 rounded-b-2xl border-t-2 border-emerald-400/40"></div>
        <div id="gardenItemsContainer" class="relative z-10 w-full flex items-end justify-around">
          <div class="text-4xl animate-bounce" style="animation-duration: 2.2s;">🌱</div>
          <div class="text-5xl animate-float" style="animation-duration: 4s;">🐰</div>
          <div class="text-4xl animate-bounce" style="animation-duration: 2.8s; animation-delay: 0.5s;">🌷</div>
          <div class="text-4xl animate-float" style="animation-duration: 3.5s; animation-delay: 1s;">🦋</div>
          <div class="text-4xl animate-pulse-gentle">🌼</div>
        </div>
      </div>

      <div class="mt-3 relative z-10">
        <div class="flex justify-between text-xs font-extrabold text-emerald-800 mb-1">
          <span>つぎのレベルまで（かん字をれんしゅうしてね！）</span>
          <span id="levelProgressText">0 / 3</span>

        <div class="w-full bg-white/80 h-3 rounded-full overflow-hidden border border-emerald-300 p-0.5 shadow-inner">

            ✨ なぞりれんしゅう
          </button>
          <button id="modeChallengeBtn" class="bouncy-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-black text-slate-500 hover:text-pink-500">

        </div>
      </div>

        <!-- キャンバス本体 -->

          <!-- 十字の補助線（ノートのマス目） -->

          <div class="absolute inset-0 pointer-events-none flex items-center justify-center">

          </div>
          <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="h-full w-[2px] bg-pink-200/60"></div>
          </div>

          <canvas id="guideCanvas" class="absolute inset-0 w-full h-full pointer-events-none transition-opacity duration-300 z-10"></canvas>

        </div>

        <div class="flex flex-row lg:flex-col justify-center items-center gap-3 w-full lg:w-auto">

        </div>

      <div id="coachMessageBox" class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 text-center transition-all">
        <p id="coachText" class="text-xs md:text-sm font-extrabold text-amber-800">
          うすいピンクの文字を、ゆびやペンでていねいになぞってみよう！🌸
        </p>
      </div>

    </section>
  </main>

  <!-- シール帳モーダル -->
  <div id="collectionModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-gradient-to-b from-pink-50 to-white max-w-2xl w-full max-h-[85vh] rounded-3xl border-4 border-pink-300 shadow-2xl flex flex-col overflow-hidden">
      <div class="p-4 bg-pink-100 border-b-2 border-pink-200 flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📖</span>
          <h2 class="text-lg md:text-xl font-extrabold text-pink-700">まほうの漢字シールちょう</h2>
        </div>
        <button id="closeCollectionBtn" class="bouncy-btn w-8 h-8 rounded-full bg-white text-pink-500 font-bold border-2 border-pink-200 flex items-center justify-center">✕</button>

      <div class="p-4 overflow-y-auto flex-1">

  <!-- はなまる成功モーダル -->

    <div class="bg-white/95 rounded-3xl border-4 border-pink-400 p-6 shadow-2xl flex flex-col items-center gap-3 max-w-sm w-full text-center transform scale-90 transition-all duration-300 pointer-events-auto" id="hanamaruCard">
      <div class="relative">
        <span class="text-7xl md:text-8xl inline-block animate-bounce">💮</span>
        <span class="absolute -top-2 -right-2 text-3xl animate-spin" style="animation-duration: 4s;">✨</span>
      </div>
      <h3 id="hanamaruTitle" class="text-2xl font-black text-pink-600">たいへんよくできました！</h3>
      <p id="hanamaruMsg" class="text-xs md:text-sm font-extrabold text-slate-600">
        まほうのしずくが <b>+30</b> ふえたよ！お庭にお花が咲いたよ🌷
      </p>
      <div class="w-full flex gap-2 mt-2">
        <button id="modalNextKanjiBtn" class="bouncy-btn flex-1 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black py-2.5 rounded-xl shadow border-2 border-white text-sm">
          つぎのかん字へ！ 🚀
        </button>
      </div>
    </div>
  </div>

  <script>
    /* 効果音シンセサイザー */
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggle() {
        this.enabled = !this.enabled;
        return this.enabled;
      }
      playStroke() {
        if (!this.enabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const freqs = [523.25, 659.25, 783.99, 1046.50];
          const f = freqs[Math.floor(Math.random() * freqs.length)];
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch (e) {}
      }
      playSparkle() {
        if (!this.enabled) return;
        this.init();
        try {
          const notes = [659.25, 783.99, 987.77, 1318.51];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
            gain.gain.setValueAtTime(0.06, this.ctx.currentTime + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + idx * 0.05 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.05);
            osc.stop(this.ctx.currentTime + idx * 0.05 + 0.25);
          });
        } catch(e) {}
      }
      playTryAgain() {
        if (!this.enabled) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(370, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(260, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.3);
        } catch (e) {}
      }
      playHanamaru() {
        if (!this.enabled) return;
        this.init();
        try {
          const chords = [523.25, 659.25, 783.99, 1046.50, 1318.51];
          chords.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + i * 0.08 + 0.6);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + i * 0.08);
            osc.stop(this.ctx.currentTime + i * 0.08 + 0.6);
          });
        } catch(e) {}
      }
    }
    const sfx = new SoundEffects();
  </script>

  <script>
    const state = {
      currentKanjiIndex: 0, // 初期は「一」
      mode: 'practice',     // 'practice' or 'challenge'
      penColor: '#ec4899',
      drops: 0,
      gardenLevel: 1,
      exp: 0,
      expNeeded: 3,
      selectedCategory: 'all',
      masteredKanji: new Set(),
      strokes: [],
      currentStroke: [],
      isDrawing: false

    // DOM要素参照
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const guideCanvas = document.getElementById('guideCanvas');
    const guideCtx = guideCanvas.getContext('2d');
    const targetKanjiChar = document.getElementById('targetKanjiChar');
    const targetKanjiReading = document.getElementById('targetKanjiReading');
    const targetKanjiStrokes = document.getElementById('targetKanjiStrokes');
    const targetKanjiMeaning = document.getElementById('targetKanjiMeaning');
    const modePracticeBtn = document.getElementById('modePracticeBtn');
    const modeChallengeBtn = document.getElementById('modeChallengeBtn');
    const coachText = document.getElementById('coachText');
    const coachMessageBox = document.getElementById('coachMessageBox');
    const dropsCountEl = document.getElementById('dropsCount');
    const gardenLevelText = document.getElementById('gardenLevelText');
    const levelProgressText = document.getElementById('levelProgressText');
    const levelProgressBar = document.getElementById('levelProgressBar');
    const unlockedCountEl = document.getElementById('unlockedCount');
    const gardenItemsContainer = document.getElementById('gardenItemsContainer');

    // モーダル
    const collectionModal = document.getElementById('collectionModal');
    const viewCollectionBtn = document.getElementById('viewCollectionBtn');
    const closeCollectionBtn = document.getElementById('closeCollectionBtn');
    const stickersGrid = document.getElementById('stickersGrid');
    const hanamaruModal = document.getElementById('hanamaruModal');
    const modalNextKanjiBtn = document.getElementById('modalNextKanjiBtn');

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      setupCategoryTabs();
      renderKanjiPicker();
      renderStickersGrid();
      
      if (document.fonts) {
        document.fonts.ready.then(() => {
          drawGuideKanji();
        });
      }
      
      loadKanji(0);
      setupEvents();
    });

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      
      guideCanvas.width = rect.width * dpr;
      guideCanvas.height = rect.height * dpr;
      guideCtx.scale(dpr, dpr);
      
      drawGuideKanji();
      redrawAllStrokes();
    }

    // 綺麗な教科書体・正統フォントで薄いピンクのお手本を描画
    function drawGuideKanji() {
      const rect = guideCanvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      guideCtx.clearRect(0, 0, rect.width, rect.height);

      const data = KANJI_DATA[state.currentKanjiIndex];
      if (!data) return;

      const fontSize = Math.min(rect.width, rect.height) * 0.76;
      guideCtx.textAlign = 'center';
      guideCtx.textBaseline = 'middle';
      guideCtx.font = `900 ${fontSize}px "Zen Maru Gothic", "UD デジタル 教科書体 N-R", "UD DigiKyoKaSho N-R", "BIZ UDPGothic", sans-serif`;

      // 薄いピンク色でくっきりと視認できる文字を描画
      guideCtx.fillStyle = 'rgba(244, 114, 182, 0.32)';
      guideCtx.fillText(data.char, rect.width / 2, rect.height / 2 + rect.height * 0.02);
    }

    function setupCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        const isActive = state.selectedCategory === cat.id;
        btn.className = `bouncy-btn whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${
          isActive 
            ? 'bg-pink-500 text-white border-pink-500 shadow-sm' 
            : 'bg-white text-slate-600 border-pink-200 hover:bg-pink-50'
        }`;
        btn.textContent = cat.label;
        btn.addEventListener('click', () => {
          state.selectedCategory = cat.id;
          setupCategoryTabs();
          renderKanjiPicker();
        });
        container.appendChild(btn);
      });
    }

    function renderKanjiPicker() {
      const picker = document.getElementById('kanjiPicker');
      picker.innerHTML = '';
      KANJI_DATA.forEach((item, index) => {
        if (state.selectedCategory !== 'all' && item.cat !== state.selectedCategory) {
          return;
        }
        const isCurrent = index === state.currentKanjiIndex;
        const isMastered = state.masteredKanji.has(item.char);
        const card = document.createElement('button');
        card.className = `bouncy-btn flex-shrink-0 w-11 h-11 md:w-12 md:h-12 rounded-2xl flex flex-col items-center justify-center relative font-black text-lg transition-all ${
          isCurrent 
            ? 'bg-gradient-to-tr from-pink-500 to-rose-400 text-white shadow-lg scale-105 border-2 border-white ring-2 ring-pink-300' 
            : isMastered
            ? 'bg-amber-100 text-amber-800 border-2 border-amber-300 hover:bg-amber-200'
            : 'bg-white text-slate-700 border-2 border-pink-100 hover:border-pink-300'
        }`;
        card.innerHTML = `
          <span>${item.char}</span>
          ${isMastered ? '<span class="absolute -top-1 -right-1 text-xs">⭐</span>' : ''}
        `;
        card.addEventListener('click', () => {
          loadKanji(index);
          renderKanjiPicker();
        });
        picker.appendChild(card);
      });
    }

    function loadKanji(index) {
      state.currentKanjiIndex = index;
      const data = KANJI_DATA[index];
      targetKanjiChar.textContent = data.char;
      targetKanjiReading.textContent = data.reading;
      targetKanjiStrokes.textContent = `${data.strokes}かく`;
      targetKanjiMeaning.textContent = data.desc;

      clearCanvas();
      drawGuideKanji();

      coachText.textContent = state.mode === 'practice'
        ? `うすい「${data.char}」をなぞってみよう！🌸`
        : `みほんをみながら、じぶんで「${data.char}」を書いてみよう！がんばれ！👑`;
    }

    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      e.preventDefault();
      sfx.init();
      state.isDrawing = true;
      const pos = getCanvasCoordinates(e);
      state.currentStroke = [{ x: pos.x, y: pos.y, color: state.penColor }];
      sfx.playStroke();
      spawnSparkle(e);
    }

    function draw(e) {
      if (!state.isDrawing) return;
      e.preventDefault();
      const pos = getCanvasCoordinates(e);
      state.currentStroke.push({ x: pos.x, y: pos.y, color: state.penColor });

      const len = state.currentStroke.length;
      if (len > 1) {
        const p1 = state.currentStroke[len - 2];
        const p2 = state.currentStroke[len - 1];

        ctx.beginPath();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 14;

        if (state.penColor === 'rainbow') {
          const hue = (Date.now() / 4) % 360;
          ctx.strokeStyle = `hsl(${hue}, 85%, 60%)`;
          ctx.shadowColor = `hsl(${hue}, 85%, 60%)`;
        } else {
          ctx.strokeStyle = state.penColor;
          ctx.shadowColor = state.penColor;
        }
        ctx.shadowBlur = 4;

        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        if (len % 3 === 0) {
          sfx.playStroke();
          spawnSparkle(e);
        }
      }
    }

    function stopDrawing() {
      if (!state.isDrawing) return;
      state.isDrawing = false;
      if (state.currentStroke.length > 0) {
        state.strokes.push([...state.currentStroke]);
        state.currentStroke = [];
      }
    }

    function redrawAllStrokes() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.shadowBlur = 4;

      state.strokes.forEach(stroke => {
        if (stroke.length < 2) return;
        for (let i = 1; i < stroke.length; i++) {
          const p1 = stroke[i - 1];
          const p2 = stroke[i];
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 14;
          if (p2.color === 'rainbow') {
            ctx.strokeStyle = '#ec4899';
            ctx.shadowColor = '#f472b6';
          } else {
            ctx.strokeStyle = p2.color;
            ctx.shadowColor = p2.color;
          }
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });
    }

    function undoStroke() {
      if (state.strokes.length > 0) {
        state.strokes.pop();
        redrawAllStrokes();
        sfx.playSparkle();
      }
    }

    function clearCanvas() {
      state.strokes = [];
      state.currentStroke = [];
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
    }

    function spawnSparkle(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const sparkle = document.createElement('div');
      const emojis = ['✨', '💖', '⭐', '🌸'];
      sparkle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      sparkle.style.position = 'fixed';
      sparkle.style.left = `${clientX + (Math.random() * 20 - 10)}px`;
      sparkle.style.top = `${clientY + (Math.random() * 20 - 10)}px`;
      sparkle.style.fontSize = `${14 + Math.random() * 12}px`;
      sparkle.style.pointerEvents = 'none';
      sparkle.style.zIndex = '9999';
      sparkle.style.animation = 'sparkle-anim 0.6s ease-out forwards';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 600);
    }

    /* 判定システム：
       お手本のフォントと同一座標で判定マスクを生成。
       「薄い文字の半分ほどのはみ出し」は許容しつつ、
       写真にあったV字線や斜め線、大幅な落書きは確実にブロックします。 */
    function evaluateKanjiMatch(char) {
      const sampleSize = 160;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = sampleSize;
      offCanvas.height = sampleSize;
      const octx = offCanvas.getContext('2d');

      const fontSize = sampleSize * 0.76;

      // 1. お手本文字（ターゲット）
      octx.clearRect(0, 0, sampleSize, sampleSize);
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.font = `900 ${fontSize}px "Zen Maru Gothic", "UD デジタル 教科書体 N-R", "UD DigiKyoKaSho N-R", "BIZ UDPGothic", sans-serif`;
      octx.fillStyle = '#000000';
      octx.fillText(char, sampleSize / 2, sampleSize / 2 + sampleSize * 0.02);
      const targetImgData = octx.getImageData(0, 0, sampleSize, sampleSize).data;

      // 2. 許容ゾーン（薄い文字の線の半分程度外側まで拡張したエリア）
      octx.clearRect(0, 0, sampleSize, sampleSize);
      octx.strokeStyle = '#000000';
      octx.lineWidth = sampleSize * 0.11; // 文字幅の半分程度のはみ出しを許容
      octx.lineJoin = 'round';
      octx.strokeText(char, sampleSize / 2, sampleSize / 2 + sampleSize * 0.02);
      octx.fillText(char, sampleSize / 2, sampleSize / 2 + sampleSize * 0.02);
      const tolerantImgData = octx.getImageData(0, 0, sampleSize, sampleSize).data;

      // 3. ユーザーの手書きデータ
      octx.clearRect(0, 0, sampleSize, sampleSize);
      octx.drawImage(canvas, 0, 0, sampleSize, sampleSize);
      const userImgData = octx.getImageData(0, 0, sampleSize, sampleSize).data;

      let targetPixels = 0;
      let coveredTargetPixels = 0;
      let userPixels = 0;
      let tolerantInBoundsPixels = 0;
      let severeOutOfBoundsPixels = 0;

      for (let i = 3; i < targetImgData.length; i += 4) {
        const isTarget = targetImgData[i] > 50;
        const isTolerant = tolerantImgData[i] > 30;
        const isUser = userImgData[i] > 40;

        if (isTarget) targetPixels++;
        if (isUser) {
          userPixels++;
          if (isTolerant) {
            tolerantInBoundsPixels++;
          } else {
            severeOutOfBoundsPixels++;
          }
        }
        if (isTarget && isUser) {
          coveredTargetPixels++;
        }
      }

      const coverageRatio = targetPixels > 0 ? (coveredTargetPixels / targetPixels) : 0;
      const inBoundsRatio = userPixels > 0 ? (tolerantInBoundsPixels / userPixels) : 0;
      const outOfBoundsRatio = userPixels > 0 ? (severeOutOfBoundsPixels / userPixels) : 0;

      return {
        userPixels,
        targetPixels,
        coverageRatio,
        inBoundsRatio,
        outOfBoundsRatio
      };
    }

    function triggerTryAgainFeedback(message) {
      sfx.playTryAgain();
      coachText.textContent = message;
      coachMessageBox.classList.add('bg-rose-100', 'border-rose-300');

      const canvasWrapper = canvas.parentElement;
      canvasWrapper.classList.remove('animate-shake');
      void canvasWrapper.offsetWidth;
      canvasWrapper.classList.add('animate-shake');

      setTimeout(() => {
        coachMessageBox.classList.remove('bg-rose-100', 'border-rose-300');
        canvasWrapper.classList.remove('animate-shake');
      }, 1500);
    }

    function judgeDrawing() {
      if (state.strokes.length === 0) {
        triggerTryAgainFeedback("あれれ？まだ何も書かれていないよ！指やペンで書いてみてね🌸");
        return;
      }

      const current = KANJI_DATA[state.currentKanjiIndex];
      const result = evaluateKanjiMatch(current.char);

      // 書いた量が少なすぎる場合（点だけ、極端に短い線）
      if (result.userPixels < 120) {
        triggerTryAgainFeedback(`もう少し最後までていねいに「${current.char}」を書いてみよう！💪`);
        return;
      }

      // はみ出し判定（薄い文字の半分を超えて外に出ている割合が16%以上あれば不合格）
      // V字や斜め線などの不正解はこの基準で確実に弾かれます
      if (result.outOfBoundsRatio > 0.16 || result.inBoundsRatio < 0.84) {
        triggerTryAgainFeedback("おっとっと！大きくはみ出しちゃったよ！お手本の線をなぞってみよう🌸");
        return;
      }

      // なぞり網羅度（線の端までしっかり届いているか）
      const minCoverage = state.mode === 'practice' ? 0.30 : 0.22;
      if (result.coverageRatio < minCoverage) {
        triggerTryAgainFeedback(`まだ抜けている線があるかも！「${current.char}」の形をぜんぶなぞってみよう✨`);
        return;
      }

      // 合格！
      handleSuccess();
    }

    function handleSuccess() {
      sfx.playHanamaru();

      if (window.confetti) {
        confetti({
          particleCount: 70,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#f472b6', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa']
        });
      }

      const current = KANJI_DATA[state.currentKanjiIndex];
      state.masteredKanji.add(current.char);

      const earnedDrops = state.mode === 'practice' ? 20 : 35;
      state.drops += earnedDrops;
      dropsCountEl.textContent = state.drops;

      state.exp++;
      if (state.exp >= state.expNeeded) {
        state.gardenLevel++;
        state.exp = 0;
        state.expNeeded = Math.min(10, state.expNeeded + 1);
        gardenLevelText.textContent = state.gardenLevel;
        addNewGardenFriend();
      }

      const pct = Math.floor((state.exp / state.expNeeded) * 100);
      levelProgressBar.style.width = `${pct}%`;
      levelProgressText.textContent = `${state.exp} / ${state.expNeeded}`;
      unlockedCountEl.textContent = state.masteredKanji.size;

      const hanamaruTitle = document.getElementById('hanamaruTitle');
      const hanamaruMsg = document.getElementById('hanamaruMsg');
      hanamaruTitle.textContent = state.mode === 'practice' ? 'たいへんよくできました！💮' : '大せいこう！かんぺき！👑';
      hanamaruMsg.innerHTML = `「<b>${current.char}</b>」がじょうずに書けたよ！<br>まほうのしずく <b>+${earnedDrops}</b> ゲット！お庭がよろこんでるよ🌷`;

      hanamaruModal.classList.remove('hidden');
      renderKanjiPicker();
      renderStickersGrid();
    }

    function addNewGardenFriend() {
      const friends = ['🦄', '🦔', '🐤', '🌺', '🌈', '🍓', '🎀', '🪄', '🧚‍♀️', '🐿️'];
      const chosen = friends[Math.floor(Math.random() * friends.length)];
      const el = document.createElement('div');
      el.className = 'text-4xl md:text-5xl animate-bounce';
      el.style.animationDuration = `${2 + Math.random()}s`;
      el.textContent = chosen;
      gardenItemsContainer.appendChild(el);
      document.getElementById('gardenStatusText').textContent = `Lv.${state.gardenLevel}！あたらしいお友達がやってきたよ！✨`;
    }

    function setupEvents() {
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      window.addEventListener('mouseup', stopDrawing);

      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      window.addEventListener('touchend', stopDrawing);

      modePracticeBtn.addEventListener('click', () => {
        state.mode = 'practice';
        modePracticeBtn.className = 'bouncy-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-black transition-all bg-pink-500 text-white shadow';
        modeChallengeBtn.className = 'bouncy-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-black text-slate-500 hover:text-pink-500';
        guideCanvas.style.opacity = '1';
        coachText.textContent = `うすい文字をなぞってみよう！🌸`;
      });

      modeChallengeBtn.addEventListener('click', () => {
        state.mode = 'challenge';
        modeChallengeBtn.className = 'bouncy-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-black transition-all bg-purple-500 text-white shadow';
        modePracticeBtn.className = 'bouncy-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-black text-slate-500 hover:text-pink-500';
        guideCanvas.style.opacity = '0';
        coachText.textContent = `お手本を見ながら、ひとりで書いてみよう！自信をもって！👑`;
      });

      document.querySelectorAll('.pen-color-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          state.penColor = btn.dataset.color;
          sfx.playSparkle();
          spawnSparkle(e);
        });
      });

      document.getElementById('undoBtn').addEventListener('click', undoStroke);
      document.getElementById('clearBtn').addEventListener('click', clearCanvas);
      document.getElementById('judgeBtn').addEventListener('click', judgeDrawing);

      document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
        const on = sfx.toggle();
        e.currentTarget.textContent = on ? '🔊' : '🔇';
      });

      viewCollectionBtn.addEventListener('click', () => {
        collectionModal.classList.remove('hidden');
      });
      closeCollectionBtn.addEventListener('click', () => {
        collectionModal.classList.add('hidden');
      });

      modalNextKanjiBtn.addEventListener('click', () => {
        hanamaruModal.classList.add('hidden');
        let nextIdx = (state.currentKanjiIndex + 1) % KANJI_DATA.length;
        loadKanji(nextIdx);
        renderKanjiPicker();
      });
    }

    function renderStickersGrid() {
      stickersGrid.innerHTML = '';
      KANJI_DATA.forEach(item => {
        const isMastered = state.masteredKanji.has(item.char);
        const tile = document.createElement('div');
        tile.className = `aspect-square rounded-2xl flex flex-col items-center justify-center border-2 transition-all p-1 ${
          isMastered 
            ? 'bg-gradient-to-tr from-amber-200 via-yellow-100 to-amber-300 border-amber-400 shadow-md text-amber-900 scale-100'
            : 'bg-slate-100/60 border-dashed border-slate-300 text-slate-300'
        }`;
        tile.innerHTML = `
          <span class="text-xl md:text-2xl font-black">${item.char}</span>
          <span class="text-[9px] font-bold truncate max-w-full">${isMastered ? '💮できた' : '・'}</span>
        `;
        stickersGrid.appendChild(tile);
      });
    }
  </script>
</body>
</html>
